[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
; M5.begin() was measured stalling ~5.3s on every boot (bracketed with
; Serial.printf+millis() around the call, since removed). Root cause is in
; M5GFX, not M5Unified's own board-specific setup: M5GFX::init_impl() (see
; .pio/libdeps/esp32dev/M5GFX/src/M5GFX.cpp, autodetect() retry loop) calls
; autodetect() up to 5 times whenever no known SPI/I2C panel is found, which
; is always the case here (this board has no M5GFX-recognised built-in
; panel - the two SSD1306s are attached afterwards via M5.addDisplay()).
; Every one of those 5 calls runs the M5Paper candidate check, which puts
; GPIO27 into INPUT_PULLUP and busy-waits up to 1024ms for it to read high
; (the real M5Paper's e-paper "busy" line). GPIO27 on this board drives the
; piezo (see PIEZO_PIN in src/main.cpp) instead of floating high immediately,
; so all 5 attempts pay the full ~1024ms wait: 5 x ~1.02s = ~5.1s, matching
; the measurement closely (the remainder is the AXP192/M5Stack-panel probes
; also repeated 5x). Disabling cfg.clear_display made no difference because
; that only skips the reset pulse on a *matched* panel - the retry loop and
; the M5Paper GPIO27 poll run unconditionally either way.
; M5GFX_BOARD (see the M5GFX_BOARD examples under
; .pio/libdeps/esp32dev/M5GFX/examples/ and M5Unified/examples/ - this is
; the library's own documented mechanism, not a hack) pre-seeds
; autodetect()'s `board` parameter as board_M5TimerCam, which is the same
; board identity M5Unified's own _check_boardtype() already assigns
; afterwards for this chip package (EFUSE_RD_CHIP_VER_PKG_ESP32D0WDQ6, see
; M5Unified.cpp) purely from the efuse read - this flag doesn't change which
; board M5Unified ends up thinking it is.
;
; Correction, 2026-09-16: this comment originally claimed the flag made
; autodetect() "return immediately on its first and only call," cutting the
; stall to near zero. Verified live and that's wrong - it only cuts the
; stall from ~5.3s to ~4.2s (still worth having, just not the full fix).
; Root cause, read directly from M5GFX.cpp: on the FIRST call the
; board_M5TimerCam pre-seed does correctly skip every per-board candidate
; check (including the slow M5Paper/GPIO27 one), same as originally
; reasoned - but autodetect() unconditionally resets `board =
; board_t::board_unknown` at its very end whenever no real panel was found
; via a `goto init_clear`, which is always true here (this board's two
; SSD1306s are I2C, attached afterwards via M5.addDisplay() - M5GFX's
; autodetect only ever looks for SPI panels). init_impl()'s outer retry
; loop (`while (board_t::board_unknown == board && --retry >= 0)`, retry
; starts at 4) sees that reset and keeps retrying - but every call *after*
; the first passes in board=0/unknown, not our pre-seed, so board==0 makes
; every candidate guard true again and the full slow probe suite (including
; the ~1024ms M5Paper/GPIO27 wait) runs again on all 4 remaining attempts:
; 4 x ~1.06s = ~4.2s, matching the corrected measurement. Also checked and
; ruled out: releasing PIEZO_PIN (pinMode(INPUT) instead of OUTPUT) around
; M5.begin() made no measurable difference, so GPIO27 reading low during
; the M5Paper probe isn't caused by this project's own prior pinMode call -
; something else holds it low, not identified further. Eliminating the
; remaining ~4.2s would need an actual change to the retry loop or the
; unconditional reset-to-unknown in M5GFX.cpp itself (fragile: both live
; under .pio/libdeps, which `pio run -t clean` / a lib_deps version bump
; regenerates from scratch, wiping any direct edit there) - not attempted.
build_flags =
    -D M5GFX_BOARD=board_M5TimerCam
    ; Lets the boot/splash sequence (main.cpp's setup()) drive u8g2Top's
    ; U8G2 instance (the POST console, on GPIO32/33 after the 2026-09-15
    ; physical-panel pin swap) over the ESP32's second hardware I2C
    ; peripheral (Wire1) instead of U8g2's own software/bit-banged I2C.
    ; Without this, U8g2's U8G2_..._2ND_HW_I2C constructor is a silent no-op
    ; (see u8x8_byte_arduino_2nd_hw_i2c in .pio/libdeps/esp32dev/U8g2/src/
    ; U8x8lib.cpp - it does nothing at all unless this macro is defined,
    ; which U8g2 would otherwise only do on its own for boards that declare
    ; WIRE_INTERFACES_COUNT > 1, which the esp32dev board variant doesn't).
    ; This was added because POST's own bit-banged send (U8g2's software I2C
    ; goes through digitalWrite() per bit, not the GPIO-matrix trick LGFX's
    ; runtime soft-I2C driver uses for the same pins) was slow enough to be
    ; the actual cause of the reported jank - see main.cpp's comment above
    ; Wire1.begin() in setup().
    -D U8X8_HAVE_2ND_HW_I2C
; Default partition table gives ~1.25MB to the app; the ESP32 BLE library
; (added for on-device config, see include/ble_config.h) pushes the image
; past that. huge_app.csv trades the second OTA slot away for a 3MB app
; partition instead - fine here since this board is flashed over USB
; serial, not updated over the air.
; Local copy of the stock huge_app.csv preset: once custom_sdkconfig (below)
; switches this env to an IDF-style build, board_build.partitions resolves
; against the project directory rather than the framework's built-in
; tools/partitions/ presets, so the bare preset name no longer resolves.
board_build.partitions = partitions_huge_app.csv
; WiFi's own IRAM footprint alone leaves only ~3KB of the 128KB IRAM region
; free (see the flash-partition comment above); NimBLE tips that over by
; ~1.2KB even with a BLE-only stack. FREERTOS_PLACE_FUNCTIONS_INTO_FLASH
; moves the scheduler's own hot-path functions from IRAM to flash-cached
; .text instead, freeing several KB of IRAM at the cost of a flash-cache
; fetch on those calls - not worth noticing (RTOS scheduling isn't
; ISR-latency-critical here). Triggers a from-source rebuild of the Arduino
; core on first build since it needs a non-default sdkconfig.
custom_sdkconfig =
    CONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH=y
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7
    ; Boot POST + splash intro (boot.cpp/splash.cpp/ui.cpp, ported verbatim
    ; from ~/Code/esp32_oled/HLI) draw straight to U8g2 rather than LGFX -
    ; they're pure functions of elapsed ms + a U8G2&, with no app/net
    ; dependency, and porting the drawing calls to LGFX wasn't worth it for
    ; a sequence that only runs once before the avatar takes the panel over.
    olikraus/U8g2 @ ^2.35.30
    ; NimBLE, not the arduino-esp32-bundled BLEDevice.h: the bundled one
    ; links Bluedroid's dual-mode (classic BT + BLE) controller blob
    ; regardless of which half is used - CONFIG_BT_CLASSIC_ENABLED is baked
    ; into the prebuilt sdkconfig this core ships - which alone overflows
    ; IRAM by ~1KB once WiFi is also in the build. NimBLE is its own
    ; BLE-only stack, ~50% less flash and ~100KB less RAM for the same API.
    h2zero/NimBLE-Arduino @ ^2.5.1
    ; Multifunction push button (click/double-click/long-press debounce and
    ; timing) - see BUTTON_PIN in main.cpp.
    mathertel/OneButton @ ^2.6.1
