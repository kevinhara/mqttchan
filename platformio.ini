[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
; Default partition table gives ~1.25MB to the app; the ESP32 BLE library
; (added for on-device config, see include/ble_config.h) pushes the image
; past that. huge_app.csv trades the second OTA slot away for a 3MB app
; partition instead - fine here since this board is flashed over USB
; serial, not updated over the air.
; Local copy of the stock huge_app.csv preset: once custom_sdkconfig (below)
; switches this env to an IDF-style build, board_build.partitions resolves
; against the project directory rather than the framework's built-in
; tools/partitions/ presets, so the bare preset name no longer resolves.
board_build.partitions = partitions_huge_app.csv
; WiFi's own IRAM footprint alone leaves only ~3KB of the 128KB IRAM region
; free (see the flash-partition comment above); NimBLE tips that over by
; ~1.2KB even with a BLE-only stack. FREERTOS_PLACE_FUNCTIONS_INTO_FLASH
; moves the scheduler's own hot-path functions from IRAM to flash-cached
; .text instead, freeing several KB of IRAM at the cost of a flash-cache
; fetch on those calls - not worth noticing (RTOS scheduling isn't
; ISR-latency-critical here). Triggers a from-source rebuild of the Arduino
; core on first build since it needs a non-default sdkconfig.
custom_sdkconfig =
    CONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH=y
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    https://github.com/stack-chan/m5stack-avatar.git
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7
    ; NimBLE, not the arduino-esp32-bundled BLEDevice.h: the bundled one
    ; links Bluedroid's dual-mode (classic BT + BLE) controller blob
    ; regardless of which half is used - CONFIG_BT_CLASSIC_ENABLED is baked
    ; into the prebuilt sdkconfig this core ships - which alone overflows
    ; IRAM by ~1KB once WiFi is also in the build. NimBLE is its own
    ; BLE-only stack, ~50% less flash and ~100KB less RAM for the same API.
    h2zero/NimBLE-Arduino @ ^2.5.1
