# Anonymous, LAN/Tailscale-only MQTT bus for avatar-brain -> avatar-demo.
# Do not port-forward either listener to the public internet.

listener 1883
protocol mqtt
allow_anonymous true

# WebSocket listener, fronted by Caddy at mqtt.kev.nz (see README.md) for
# browser tools/dashboards. Devices that speak plain MQTT (the ESP32
# included) should connect to 1883 directly instead — no reason to pay for
# WebSocket framing on a memory-constrained device.
listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
